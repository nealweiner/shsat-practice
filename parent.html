<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHSAT Progress</title>
<style>
  :root{--ink:#1A2B4A;--accent:#7A4A1F;--soft:#F3F0EA;--bg:#FBFAF7;--good:#1E7A4A;--bad:#A32B2B;--line:#DDD6C9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Georgia,serif}
  .wrap{max-width:900px;margin:0 auto;padding:24px 18px 60px}
  h1{font-size:26px;margin:0 0 4px}
  h2{font-size:19px;margin:24px 0 8px}
  .sub{color:var(--accent);font-size:14px;margin-bottom:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:10px 0;overflow-x:auto}
  .meta{font:13px system-ui,sans-serif;color:#6B6355}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .tile b{display:block;font-size:26px;line-height:1.2}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:6px 6px;border-top:1px solid var(--line);vertical-align:top}
  th{font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#6B6355;border-top:none}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{display:inline-block;width:110px;height:8px;background:var(--line);border-radius:4px;vertical-align:middle;margin-right:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--good)}
  .bar i.low{background:var(--bad)}.bar i.mid{background:#b8860b}
  .wrong{color:var(--bad)}.right{color:var(--good)}
  details{margin:4px 0}summary{cursor:pointer;font:13px system-ui,sans-serif;color:var(--accent)}
  .qtext{font-size:14px;margin:6px 0 0 12px;max-width:640px}
  .qtext p{margin:0 0 5px}.qtext blockquote{margin:5px 0;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
  .qtext img{max-width:100%;border:1px solid var(--line)}
  .src{font:12px system-ui,sans-serif;color:#6B6355}
  .warn{background:#FFF8E1;border:1px solid #b8860b;border-radius:8px;padding:10px 14px;font:14px system-ui,sans-serif}
  @media (max-width:600px){.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>SHSAT Progress</h1>
  <div class="sub">Every answer and session from the practice sets and grammar lessons. Time counts whenever the app is in front and being used, including reading.</div>
  <div id="app"><p class="meta">Loading&hellip;</p></div>
</div>
<script src="config.js"></script>
<script src="bank.js"></script>
<script src="items.js"></script>
<script src="gengrammar.js"></script>
<script src="rcmeta.js"></script>
<script src="concepts.js"></script>
<script src="dups.js"></script>
<script src="mathmeta.js"></script>
<script src="genmath.js"></script>
<script>
if (typeof GENGRAMMAR !== 'undefined') GENGRAMMAR.forEach(g => ITEMS.push(g));   // written questions count toward each concept's bank
const RC_TYPE = { 'main-idea': 'Main idea and summary', detail: 'Stated detail', inference: 'Inference', evidence: 'Finding the evidence for an idea', function: 'What a paragraph or detail is doing there', craft: 'Author\u2019s craft: tone, word choice, form', vocab: 'Words and phrases in context', graphic: 'Graphs, maps and tables' };
const RC_KIND = { science: 'Science', history: 'History and society', literary: 'Fiction and literary nonfiction', poetry: 'Poetry' };
const AREA = { rea: 'Revising/Editing: sentences', reb: 'Revising/Editing: passage', rc: 'Reading', grid: 'Grid-in math', mc: 'Math multiple choice' };
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const day = ts => new Date(ts).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const ymd = ts => { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const mins = s => s ? Math.round(s/60) : 0;
const pct = (r, t) => t ? Math.round(100*r/t) : 0;
const bar = p => `<span class="bar"><i class="${p < 60 ? 'low' : p < 80 ? 'mid' : ''}" style="width:${p}%"></i></span>${p}%`;

// Google Sheets parses a score like "7/8" as a date (July 8) unless the cell is text; undo that for old rows.
function fixScore(v){ const m = /^(\d{4})-(\d{2})-(\d{2})T/.exec(String(v || '')); return m ? (+m[2]) + '/' + (+m[3]) : v; }
async function rows(){
  let local = []; try { local = JSON.parse(localStorage.getItem('shsat:log')) || []; } catch (e) {}
  if (!LOG_URL) return { rows: local, source: 'this device only (no log endpoint configured in config.js)' };
  try {
    const r = await fetch(LOG_URL); const remote = await r.json();
    // A batch whose page closed before the POST was acknowledged is sent again on the next
    // load, so the sheet can hold the same row twice (same timestamp, same everything).
    const seen = new Set(), uniq = remote.filter(e => { const k = JSON.stringify(e); return seen.has(k) ? false : (seen.add(k), true); });
    uniq.forEach(e => { e.score = fixScore(e.score); });
    return { rows: uniq, source: 'shared log, ' + uniq.length + ' rows' + (remote.length > uniq.length ? ' (' + (remote.length - uniq.length) + ' repeated rows ignored)' : '') };
  } catch (e) { return { rows: local, source: 'could not reach the shared log; showing this device only' }; }
}

/* difficulty of a logged math answer, from the same ranking the app uses (0-100) */
const FORMID = {}; BANK.forEach(f => { FORMID[f.id.slice(0,4) + ' Form ' + f.id.slice(4)] = f.id; });
function diff(e){ const id = e.form === 'Extra' ? 'gen:' + e.n : (FORMID[e.form] || '') + ':' + e.n; const m = MATHMETA[id] || MATHMETA[DUPS[id]]; return m ? Math.round(m.d * 100) : null; }
/* question text lookups, so a miss can be read without opening the test */
const FORMS = {}; BANK.forEach(f => { FORMS[f.id.slice(0,4) + ' Form ' + f.id.slice(4)] = f; });
function questionHTML(e){
  if (e.form === 'Extra' && e.app !== 'grammar') { const g = GENMATH.find(g => g.id === 'gen:' + e.n); return g ? g.html + (g.opts || []).map((o,j) => `<div>${'ABCD'[j]}. ${o}</div>`).join('') : ''; }
  if (e.app === 'grammar') {
    if (/^check /.test(e.n)) { const c = CONCEPTS.find(c => c.id === e.tag); const k = +String(e.n).split(' ')[1] - 1; return c && c.check[k] ? c.check[k].q : ''; }
    const it = ITEMS.find(i => i.form === e.form && String(i.n) === String(e.n)); return it ? it.html + it.opts.map((o,j) => `<div>${it.letters[j]}. ${esc(o)}</div>`).join('') : '';
  }
  const f = FORMS[e.form]; if (!f) return '';
  const n = +e.n;
  for (const p of f.ela.parts) for (const g of p.groups) for (const q of g.questions) if (q.n === n) return q.html + q.opts.map((o,j) => `<div>${q.letters[j]}. ${esc(o)}</div>`).join('');
  const m = f.math.grid.concat(f.math.mc).find(q => q.n === n); return m ? `<img src="${m.img}" alt="question ${n}">` : '';
}

/* Rows logged before the active-time clock timed sessions and questions by wall clock, so a
   tab left open reads as hours. A question is trusted up to Q_CAP; a session longer than its
   own questions could explain is replaced by the sum of those questions and marked approximate. */
const Q_CAP = 240, SES_SLACK = 1200, Q_STALE = 3600;
function sane(R){
  const perSes = {};
  R.rows.forEach(e => { if (e.kind === 'answer') perSes[e.session] = (perSes[e.session] || 0) + Math.min(+e.secs || 0, Q_CAP); });
  R.rows.forEach(e => { if (e.kind !== 'session') return; const est = perSes[e.session] || 0;
    if ((+e.secs || 0) > est + SES_SLACK) { e.secs = est; e.approx = true; } });
}
/* ============================ RATINGS ============================
   One row per area, each with a rating and what to do about it.
   Grammar: the two comma lessons share one tag on the real questions, so they are rated together.
   A rating needs RATE_MIN answers; below that the row says so and gives the count.
   Math: questions differ in difficulty, so raw accuracy says little (the adaptive set aims
   each problem at his level, where anyone gets about half). Instead each topic gets its own
   level on the bank's 0-100 scale: the posterior mean under the same logistic model the app
   uses (slope 8), starting from a prior centred on his overall level. With no answers a topic
   sits at the overall level; every answer pulls it. */
const RATE_MIN = 6, RATE_MIN_MATH = 4, PRIOR_SD = 0.15, M_SLOPE = 8;
function topicLevel(rows, centre){
  let sw = 0, sm = 0, sv = 0;
  for (let i = -40; i <= 140; i++) { const th = i/100;   /* past both ends, so a prior centred near 100 is not cut off on one side */ let lw = -((th - centre) ** 2) / (2 * PRIOR_SD * PRIOR_SD);
    rows.forEach(r => { const p = 1 / (1 + Math.exp(-(th - r.d) * M_SLOPE)); lw += Math.log(r.ok ? p : 1 - p); });
    const w = Math.exp(lw); sw += w; sm += w * th; sv += w * th * th; }
  const m = sm / sw; return { m: Math.min(0.99, Math.max(0.01, m)), sd: Math.sqrt(Math.max(0, sv / sw - m * m)) };
}
function ratingsHTML(ans, ses){
  const when = ts => ts ? day(ts) : '';
  const pill = (t, c) => `<b class="${c || ''}">${t}</b>`;
  // ---- grammar areas
  const G = [];
  CONCEPTS.forEach(c => { const key = c.tags[0] || c.id; let g = G.find(x => x.key === key);
    if (!g) G.push(g = { key, names: [], ids: [], tags: [], q: 0, ok: 0, last: 0, lessons: 0, of: 0 });
    g.names.push(c.name.replace(/^Commas /, '')); g.ids.push(c.id); c.tags.forEach(t => g.tags.includes(t) || g.tags.push(t)); g.of++; });
  G.forEach(g => { g.name = g.names.length > 1 ? 'Commas: ' + g.names.map(n => n.split(',')[0].replace(/^that /, '')).join('; ') : g.names[0];
    g.bank = ITEMS.filter(it => g.tags.includes(it.tag)).length; g.extra = ITEMS.filter(it => g.tags.includes(it.tag) && it.form === 'Extra').length; });
  const lessonDone = new Set(ses.filter(e => /^Lesson: /.test(e.title)).map(e => e.title.slice(8)));
  CONCEPTS.forEach(c => { if (lessonDone.has(c.name)) G.find(g => g.ids.includes(c.id)).lessons++; });
  const itemTag = {}; ITEMS.forEach(it => { itemTag[it.form + '|' + it.n] = it.tag; });
  let reviews = ses.filter(e => e.tag === 'review').length;
  const other = { reb: { name: 'Revising/Editing passages (in a drill or test)', q: 0, ok: 0, last: 0 }, rc: { name: 'Reading comprehension', q: 0, ok: 0, last: 0 }, grid: { name: 'Grid-in format', q: 0, ok: 0, last: 0 } };
  // ---- math topics
  const lv = ses.filter(e => /level \d+ → \d+/.test(e.title)).pop();
  const M = {}; Object.values(MATHMETA).forEach(m => { M[m.t] = M[m.t] || { rows: [], bank: 0, last: 0 }; M[m.t].bank++; });
  const allMath = [];
  const RT = {}, RK = {}; Object.keys(RC_TYPE).forEach(k => { RT[k] = { name: RC_TYPE[k], q: 0, ok: 0, last: 0, bank: 0 }; }); Object.keys(RC_KIND).forEach(k => { RK[k] = { name: RC_KIND[k], q: 0, ok: 0, last: 0, bank: 0 }; });
  const RCM = typeof RCMETA === 'undefined' ? {} : RCMETA; Object.values(RCM).forEach(m => { RT[m.t].bank++; RK[m.g].bank++; });
  ans.forEach(e => {
    const t = new Date(e.ts).getTime(), ok = +e.ok;
    if (e.app === 'grammar') { const c = CONCEPTS.find(c => c.name === e.block) || CONCEPTS.find(c => c.id === e.tag) || CONCEPTS.find(c => c.tags.includes(e.tag)); const g = c && G.find(g => g.ids.includes(c.id)); if (g) { g.q++; g.ok += ok; g.last = Math.max(g.last, t); } return; }
    const id = e.form === 'Extra' ? 'gen:' + e.n : (FORMID[e.form] || '') + ':' + e.n, mm = (e.tag === 'adaptive' || e.tag === 'grid' || e.tag === 'mc') && MATHMETA[id];
    if (mm) { const r = { d: mm.d, ok }; M[mm.t].rows.push(r); M[mm.t].last = Math.max(M[mm.t].last, t); allMath.push(r); }
    if (e.tag === 'rea' || e.tag === 'reb') { const g = G.find(g => g.tags.includes(itemTag[e.form + '|' + e.n])); if (g) { g.q++; g.ok += ok; g.last = Math.max(g.last, t); } }
    const rm = e.tag === 'rc' && RCM[(FORMID[e.form] || '') + ':' + e.n];
    if (rm) [RT[rm.t], RK[rm.g]].forEach(o => { o.q++; o.ok += ok; o.last = Math.max(o.last, t); });
    if (other[e.tag]) { const o = other[e.tag]; o.q++; o.ok += ok; o.last = Math.max(o.last, t); }
  });
  const overall = lv ? +lv.title.match(/→ (\d+)/)[1] / 100 : allMath.length ? topicLevel(allMath, 0.65).m : null;

  const todo = [];
  const grade = (q, ok) => { const p = pct(ok, q);
    if (!q) return ['Not started', 'meta', 3];
    if (q < RATE_MIN) return q - ok >= 2 && p <= 60 ? ['Early warning', 'wrong', 1] : ['Too few to rate', 'meta', 4];
    return p >= 85 ? ['Solid', 'right', 5] : p >= 70 ? ['Shaky', '', 2] : ['Needs work', 'wrong', 0]; };
  let h = `<h2>Where he stands</h2><div class="card"><p class="meta">A rating needs ${RATE_MIN} answers in the area; with fewer the row shows the count and no verdict. "Bank" is how many questions the app holds for that area: real SHSAT questions, plus any written to fill a gap.</p>
    <table><tr><th>Grammar (Revising/Editing)</th><th class="num">Right</th><th>Rating</th><th class="num hide-sm">Bank</th><th class="hide-sm">Last</th><th>Next step</th></tr>`;
  G.map(g => ({ g, r: grade(g.q, g.ok) })).sort((a, b) => a.r[2] - b.r[2] || pct(a.g.ok, a.g.q) - pct(b.g.ok, b.g.q)).forEach(({ g, r }) => {
    const step = g.lessons < g.of ? (g.q ? 'Finish the lesson' + (g.of > 1 ? 's' : '') : 'Lesson not done yet')
      : r[2] <= 1 ? 'Redo the lesson, then a Review' : r[2] === 2 ? 'Review sets' : r[2] === 4 ? (g.bank > g.q ? 'Review sets, to get a rating' : 'Bank is too small to rate; needs written questions') : 'Nothing';
    if (r[2] <= 2 || g.lessons < g.of) todo.push([r[2] <= 1 ? 0 : g.lessons < g.of ? 2 : 1, 'Grammar: ' + g.name + (g.q ? ' (' + g.ok + '/' + g.q + ')' : '') + ' — ' + step.toLowerCase()]);
    h += `<tr><td>${esc(g.name)}</td><td class="num">${g.q ? g.ok + '/' + g.q : ''}</td><td>${pill(r[0], r[1])}</td><td class="num hide-sm">${g.bank - g.extra}${g.extra ? ' + ' + g.extra : ''}</td><td class="hide-sm meta">${when(g.last)}</td><td class="meta">${step}</td></tr>`;
  });
  h += `</table><p class="meta" style="margin:8px 0 0">${reviews ? reviews + ' Review set' + (reviews > 1 ? 's' : '') + ' done.' : 'No Review set done yet. The Review is the part that adapts: 10 real questions, missed ones first, then the weakest concepts.'}</p></div>`;

  h += `<div class="card"><p class="meta">Math topics are rated as a level on the same 0–100 scale as the Math level tile${overall != null ? ' (now ' + Math.round(overall * 100) + ')' : ''}, adjusted for how hard each problem was. A topic needs ${RATE_MIN_MATH} answers for a verdict; ± is how unsure the level is, and it shrinks as he answers more.</p>
    <table><tr><th>Math topic</th><th class="num">Right</th><th class="num">Level</th><th>Rating</th><th class="num hide-sm">Bank</th><th class="hide-sm">Last</th></tr>`;
  if (overall != null) Object.keys(M).map(t => ({ t, x: M[t], L: topicLevel(M[t].rows, overall) })).sort((a, b) => (!a.x.rows.length - !b.x.rows.length) || a.L.m - b.L.m).forEach(({ t, x, L }) => {
    const n = x.rows.length, ok = x.rows.filter(r => r.ok).length, gap = overall - L.m;
    const r = !n ? ['Not seen yet', 'meta'] : n < RATE_MIN_MATH ? (n - ok >= 2 ? ['Early warning', 'wrong'] : ['Too few to rate', 'meta']) : gap >= 0.08 ? ['Behind his level', 'wrong'] : gap >= 0.03 ? ['Slightly behind', ''] : ['At his level', 'right'];
    if (r[0] === 'Early warning' || (n >= RATE_MIN_MATH && gap >= 0.03)) todo.push([gap >= 0.08 || n < RATE_MIN_MATH ? 0 : 1, 'Math: ' + t.replace(/-/g, ' ') + ' (' + ok + '/' + n + ', level about ' + Math.round(L.m * 100) + ')']);
    h += `<tr><td>${esc(t.replace(/-/g, ' '))}</td><td class="num">${n ? ok + '/' + n : ''}</td><td class="num">${n ? Math.round(L.m * 100) + ' <span class="meta">±' + Math.round(L.sd * 100) + '</span>' : ''}</td><td>${pill(r[0], r[1])}</td><td class="num hide-sm">${x.bank}</td><td class="hide-sm meta">${when(x.last)}</td></tr>`;
  });
  h += `</table></div><div class="card"><table><tr><th>Other sections</th><th class="num">Right</th><th>Rating</th><th class="hide-sm">Last</th></tr>`;
  Object.keys(other).forEach(k => { const o = other[k], r = grade(o.q, o.ok);
    if (!o.q) todo.push([2, o.name + ' — not started']);
    h += `<tr><td>${o.name}</td><td class="num">${o.q ? o.ok + '/' + o.q : ''}</td><td>${pill(r[0], r[1])}</td><td class="hide-sm meta">${when(o.last)}</td></tr>`; });
  h += `</table></div>`;
  // reading, cut two ways: by what the question asks and by the kind of passage
  const rcAny = Object.values(RT).some(o => o.q);
  [['Reading by question type', RT], ['Reading by kind of passage', RK]].forEach(([title, T]) => {
    h += `<div class="card">${T === RT ? `<p class="meta">Every reading question in the bank is tagged by what it asks and by the kind of passage it sits under, so a reading drill or test fills in both tables at once.${rcAny ? '' : ' No reading has been done yet.'}</p>` : ''}<table><tr><th>${title}</th><th class="num">Right</th><th>Rating</th><th class="num hide-sm">Bank</th><th class="hide-sm">Last</th></tr>`;
    Object.keys(T).map(k => ({ o: T[k], r: grade(T[k].q, T[k].ok) })).sort((a, b) => a.r[2] - b.r[2] || pct(a.o.ok, a.o.q) - pct(b.o.ok, b.o.q)).forEach(({ o, r }) => {
      if (r[2] <= 2) todo.push([r[2] <= 1 ? 0 : 1, 'Reading: ' + o.name + ' (' + o.ok + '/' + o.q + ')']);
      h += `<tr><td>${o.name}</td><td class="num">${o.q ? o.ok + '/' + o.q : ''}</td><td>${pill(r[0], r[1])}</td><td class="num hide-sm">${o.bank}</td><td class="hide-sm meta">${when(o.last)}</td></tr>`; });
    h += `</table></div>`; });
  todo.sort((a, b) => a[0] - b[0]);
  const top = todo.length ? `<div class="card"><b>Work on next</b><ol style="margin:6px 0 0;padding-left:22px">${todo.slice(0, 8).map(t => `<li>${esc(t[1])}</li>`).join('')}</ol></div>` : '';
  return h.replace('<h2>Where he stands</h2>', '<h2>Where he stands</h2>' + top);
}
function render(R){
  sane(R);
  const ans = R.rows.filter(e => e.kind === 'answer'), ses = R.rows.filter(e => e.kind === 'session');
  const days = {};
  R.rows.forEach(e => { const d = ymd(e.ts); days[d] = days[d] || { q: 0, ok: 0, secs: 0, act: 0 };
    if (e.kind === 'answer') { days[d].q++; days[d].ok += +e.ok; } else if (e.kind === 'time') days[d].act += +e.secs || 0; else days[d].secs += +e.secs || 0; });
  // time on task: the active-time clock when present, else the summed session times (older rows)
  Object.values(days).forEach(x => { x.mins = mins(x.act || x.secs); });
  const dayList = Object.keys(days).sort();
  // streak: consecutive days ending today or yesterday
  let streak = 0; const t = new Date(); t.setHours(12);
  for (let i = 0; i < 400; i++) { const d = ymd(t.getTime() - i*864e5); if (days[d]) streak++; else if (i > 0) break; }
  const totalOk = ans.reduce((s,e) => s + +e.ok, 0), totalMins = Object.values(days).reduce((s,x) => s + x.mins, 0);

  let h = `<div class="tiles">
    <div class="tile"><span class="meta">Days practiced</span><b>${dayList.length}</b></div>
    <div class="tile"><span class="meta">Current streak</span><b>${streak}</b></div>
    <div class="tile"><span class="meta">Time on task</span><b>${totalMins} min</b></div>
    <div class="tile"><span class="meta">Questions</span><b>${ans.length}</b></div>
    <div class="tile"><span class="meta">Accuracy</span><b>${pct(totalOk, ans.length)}%</b></div>
    <div class="tile"><span class="meta">Math level</span><b>${(() => { const m = ses.filter(e => /level \d+ \u2192 \d+/.test(e.title)).pop(); return m ? m.title.match(/\u2192 (\d+)/)[1] + ' <span class="meta">of 100</span>' : '\u2014'; })()}</b></div></div>
    <p class="meta">Source: ${R.source}. ${dayList.length ? 'First entry ' + day(R.rows[0].ts) + '.' : ''}</p>`;
  if (!R.rows.length) { h += `<div class="warn">Nothing recorded yet. Once Vaughn finishes a set or a lesson it appears here.</div>`; app.innerHTML = h; return; }

  h += ratingsHTML(ans, ses);

  // last 14 days
  h += `<h2>Last two weeks</h2><div class="card"><table><tr><th>Day</th><th class="num">Minutes</th><th class="num">Questions</th><th class="num">Right</th><th>Accuracy</th></tr>`;
  for (let i = 13; i >= 0; i--) {
    const d = ymd(Date.now() - i*864e5), x = days[d];
    h += `<tr><td>${day(d + 'T12:00:00')}</td><td class="num">${x ? x.mins : ''}</td><td class="num">${x ? x.q : ''}</td><td class="num">${x ? x.ok : ''}</td><td>${x && x.q ? bar(pct(x.ok, x.q)) : '<span class="meta">' + (x ? '' : 'no practice') + '</span>'}</td></tr>`;
  }
  h += `</table></div>`;

  // adaptive math: level history, then each answer with the problem's difficulty
  const mans = ans.filter(e => e.tag === 'adaptive');
  let msets = ses.filter(e => /level \d+ \u2192 \d+/.test(e.title));
  // sets that were started but never finished have answer rows and no session row
  const finished = new Set(msets.map(e => e.session));
  [...new Set(mans.map(a => a.session))].filter(sid => !finished.has(sid)).forEach(sid => { const a = mans.filter(x => x.session === sid); msets.push({ ts:a[0].ts, session:sid, title:'unfinished', score:a.filter(x => +x.ok).length + '/' + a.length, unfinished:true }); });
  msets.sort((a,b) => new Date(a.ts) - new Date(b.ts));
  if (msets.length) {
    h += `<h2>Math sets</h2><div class="card"><p class="meta">Level and difficulty are percentiles of the ${Object.keys(MATHMETA).length}-problem bank: 70 means harder than 70% of it. Right answers are listed with the difficulty they were at; the wrong ones are in the missed-questions list below with the problem shown.</p>
      <table><tr><th>When</th><th class="num">Level</th><th class="num">Score</th><th>Right at</th><th>Wrong at</th></tr>`;
    msets.slice().reverse().slice(0, 30).forEach(e => {
      const m = e.title.match(/level (\d+) \u2192 (\d+)/), rows = mans.filter(a => a.session === e.session);
      const ds = ok => rows.filter(a => +a.ok === ok).map(diff).filter(d => d != null).sort((a,b) => a-b).join(', ');
      h += `<tr><td>${day(e.ts)}</td><td class="num">${m ? m[1] + ' &rarr; <b>' + m[2] + '</b>' : '<span class="meta">unfinished</span>'}</td><td class="num">${esc(e.score)}</td><td class="right">${ds(1)}</td><td class="wrong">${ds(0)}</td></tr>`;
    });
    h += `</table></div>`;
  }
  // sessions
  h += `<h2>Sessions</h2><div class="card"><table><tr><th>When</th><th>What</th><th class="num">Score</th><th class="num">Minutes</th></tr>`;
  ses.slice().reverse().slice(0, 40).forEach(e => {
    h += `<tr><td>${day(e.ts)} <span class="meta">${new Date(e.ts).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</span></td><td>${esc(e.title)} <span class="src">${esc(e.tag)}</span></td><td class="num">${esc(e.score)}</td><td class="num">${e.approx ? '~' : ''}${mins(+e.secs)}</td></tr>`;
  });
  h += `</table></div>`;

  // misses
  const wrong = ans.filter(e => !+e.ok).slice().reverse().slice(0, 80);
  h += `<h2>Missed questions <span class="meta">most recent ${wrong.length}</span></h2><div class="card"><table><tr><th>When</th><th>Where</th><th>Chose</th><th>Answer</th><th class="num">Diff.</th><th class="num hide-sm">Secs</th></tr>`;
  wrong.forEach((e, i) => {
    const qh = questionHTML(e);
    h += `<tr><td>${day(e.ts)}</td><td>${esc(e.form)}${e.form ? ', ' : ''}${esc(String(e.block).replace(/-/g,' '))}${e.form === 'Extra' ? '' : ', q' + esc(e.n)}${qh ? `<details><summary>show question</summary><div class="qtext">${qh}</div></details>` : ''}</td>
      <td class="wrong">${e.form === 'Extra' ? e.chosen : esc(e.chosen)}</td><td class="right">${e.form === 'Extra' ? e.correct : esc(e.correct)}</td><td class="num">${diff(e) ?? ''}</td><td class="num hide-sm">${+e.secs > Q_STALE ? '<span class="meta">left open</span>' : e.secs || ''}</td></tr>`;
  });
  h += `</table></div>`;
  app.innerHTML = h;
}
const app = document.getElementById('app');
rows().then(render);
</script>
</body>
</html>
