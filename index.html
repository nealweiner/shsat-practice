<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHSAT Practice</title>
<style>
  :root{
    --ink:#1A2B4A; --accent:#7A4A1F; --soft:#F3F0EA; --bg:#FBFAF7;
    --good:#1E7A4A; --bad:#A32B2B; --line:#DDD6C9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 Georgia,'Iowan Old Style',serif;}
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 80px}
  header{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:22px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--accent);font-size:14px}
  h2{font-size:21px;margin:26px 0 6px}
  h3{font-size:18px;margin:0 0 4px}
  button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:6px;
    border:1px solid var(--ink);background:#fff;color:var(--ink);padding:9px 16px}
  button:hover{background:var(--soft)}
  button.primary{background:var(--ink);color:#fff}
  button.primary:hover{opacity:.88}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.small{font-size:13px;padding:4px 10px;font-family:system-ui,sans-serif}
  select,input[type=text]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:12px 0}
  .meta{font-size:13px;color:#6B6355;font-family:system-ui,sans-serif}
  .tag{display:inline-block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    background:var(--soft);border:1px solid var(--line);border-radius:20px;
    padding:2px 9px;margin-right:6px;color:var(--accent);font-family:system-ui,sans-serif}
  .passage{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin:10px 0 18px}
  .passage h3{margin:0 0 10px;font-size:19px}
  .passage p{margin:0 0 12px}
  .passage .intro{font-style:italic;color:#4a4a4a;border-bottom:1px solid var(--line);margin-bottom:12px;padding-bottom:4px}
  .passage img{max-width:100%;display:block;margin:12px auto;border:1px solid var(--line)}
  .ln{font:11px/1 system-ui,sans-serif;color:#9A9284;margin-right:6px;vertical-align:top}
  .q{border-top:1px solid var(--line);padding:16px 0}
  .q:first-child{border-top:none}
  .qtext{font-weight:bold;margin-bottom:9px}
  .qtext p{margin:0 0 8px}
  .qtext blockquote{font-weight:normal;margin:8px 0 10px;padding:10px 14px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .qimg{max-width:100%;display:block;border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.2;font-size:.9em}
  .frac .fnum{border-bottom:1.5px solid currentColor;padding:0 .3em}.frac .fden{padding:0 .3em}
  .qmath{font-size:17px;line-height:1.7;margin-bottom:10px}.qmath p{margin:0 0 8px}
  label.opt{display:block;padding:8px 11px;margin:5px 0;border:1px solid var(--line);
    border-radius:7px;cursor:pointer;background:#fff}
  label.opt:hover{background:var(--soft)}
  label.opt input{margin-right:9px}
  label.opt b{font-family:system-ui,sans-serif;margin-right:6px}
  label.opt.correct{border-color:var(--good);background:#EEF7F1}
  label.opt.chosen-wrong{border-color:var(--bad);background:#FBEFEF}
  .letters label.opt{display:inline-block;margin-right:8px;min-width:64px;text-align:center}
  .gridin{margin:6px 0}
  .gridin input{width:160px;font-size:17px}
  .gridin.correct input{border-color:var(--good);background:#EEF7F1}
  .gridin.chosen-wrong input{border-color:var(--bad);background:#FBEFEF}
  .exp{font-size:14.5px;background:var(--soft);border-left:3px solid var(--accent);
    padding:10px 13px;margin-top:9px;border-radius:0 6px 6px 0}
  .exp p{margin:0 0 7px}
  .exp img{max-width:100%;display:block;background:#fff;border:1px solid var(--line)}
  .exp .ok{color:var(--good)}
  .bar{position:sticky;top:0;background:var(--bg);padding:9px 0;z-index:9;
    border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;
    font:14px system-ui,sans-serif;flex-wrap:wrap}
  .timer{font-variant-numeric:tabular-nums;font-weight:bold}
  .over{color:var(--bad)}
  .score{font-size:30px;font-weight:bold}
  .hide{display:none}
  .note{font-size:14px;color:#6B6355;font-style:italic}
  .linkish{background:none;border:none;padding:0;color:var(--accent);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .drill{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
  .drill:first-child{border-top:none}
  .drill .meta{white-space:normal}
  table.tests{width:100%;border-collapse:collapse;font-size:15px}
  table.tests th{text-align:left;font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em;color:#6B6355;padding:4px 6px}
  table.tests td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle}
  table.tests td.row{gap:6px;flex-wrap:nowrap}
  table.tests tr.fresh td{background:#FFF8E6}
  details summary{cursor:pointer;font-size:17px;font-weight:bold;padding:6px 0}
  .rpt-head{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
  .rpt-sec{font:bold 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:22px 0 6px;color:var(--accent)}
  .rpt-item{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0;background:#fff;break-inside:avoid}
  .rpt-q{font-weight:bold;margin-bottom:7px}
  .rpt-q p{margin:0 0 6px}
  .rpt-q blockquote{font-weight:normal;margin:6px 0;padding:8px 12px;border:1px solid var(--line);border-radius:6px}
  .rpt-q img{max-width:100%;display:block;border:1px solid var(--line)}
  .rpt-row{font-size:14.5px;margin:3px 0}
  .rpt-row .lab{display:inline-block;min-width:104px;color:#6B6355;font:12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}
  .rpt-wrong{color:var(--bad)}
  .rpt-right{color:var(--good)}
  .scorebar{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0 14px;font:14px system-ui,sans-serif}
  .scorebar b{display:block;font-size:18px}
  .scorebar .meta{display:block;font-size:12px}
  body.testing header{display:none}
  body.testing .wrap{max-width:1100px;padding-top:8px}
  .tbar{position:sticky;top:0;z-index:9;background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;font:14px system-ui,sans-serif}
  .tbar .clock{margin-left:auto;font:700 20px ui-monospace,Menlo,monospace;letter-spacing:.04em}
  .tbar .clock.low{color:#ffb4a8}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-top:12px}
  .split .passage{max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:56px;margin:0}
  @media (max-width:760px){.split{grid-template-columns:1fr}.split .passage{position:static;max-height:260px}}
  .tnav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
  .tnav button{min-width:34px;padding:4px 6px;font:13px system-ui,sans-serif;border-radius:17px;background:#fff}
  .tnav button.done{background:var(--soft)}
  .tnav button.cur{border-width:2px;font-weight:700}
  .tnav button.flag::after{content:'\26A0';margin-left:3px;color:var(--bad)}
  .tq .qtext{font-size:17px}
  body.testing .tq .qimg{width:min(100%,640px)}
  @media print{
    .noprint,.bar{display:none!important}
    body{background:#fff;font-size:12.5px}
    .wrap{max-width:none;padding:0}
    .rpt-item{border-color:#999}
  }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>SHSAT Practice</h1>
  <div class="sub">Official NYC DOE sample tests, 2018&ndash;2025 &middot; ELA and Math, timed, with a review sheet</div>
</header>
<div id="app"></div>
</div>

<script src="config.js"></script>
<script src="log.js"></script>
<script src="bank.js"></script>
<script src="mathmeta.js"></script>
<script src="genmath.js"></script>
<script>
/* ============================ DATA ============================ */
const SECTION_MIN = 90;                 // suggested time per section on the paper test
const FORM_LABEL = f => f.id.slice(0,4) + ' Form ' + f.id.slice(4);

/* A "block" is one runnable unit: a passage (or none) plus its questions.
   Every question carries the fields the runner needs: id, kind, html/img,
   opts, letters, a (index or grid-in string), exp (html or img). */
function elaBlocks(f){
  const out = [];
  f.ela.parts.forEach((p, pi) => p.groups.forEach((g, gi) => {
    const title = g.passage && g.passage.title ? g.passage.title
                : (p.name.startsWith('Reading') ? 'Reading passage ' + (gi+1) : p.name);
    out.push({
      id: f.id + ':e' + pi + '.' + gi, form: f.id, section: 'ela', kind: pi===0 ? 'rea' : pi===1 ? 'reb' : 'rc',
      title: p.name === title ? title : p.name.replace('Revising/Editing ', 'R/E ') + ' — ' + title,
      passage: g.passage,
      questions: g.questions.map(q => ({ ...q, kind: 'text', id: f.id + ':' + q.n }))
    });
  }));
  return out;
}
function mathBlocks(f){
  const out = [{ id: f.id + ':g', form: f.id, section: 'math', kind: 'grid', title: 'Grid-in (58–62)', passage: null,
    questions: f.math.grid.map(q => ({ ...q, kind: 'grid', id: f.id + ':' + q.n })) }];
  const mc = f.math.mc.map(q => ({ ...q, kind: 'img', id: f.id + ':' + q.n }));
  for (let i = 0; i < mc.length; i += 13){
    const chunk = mc.slice(i, i + 13);
    out.push({ id: f.id + ':m' + i, form: f.id, section: 'math', kind: 'mc', passage: null,
      title: 'Multiple choice ' + chunk[0].n + '–' + chunk[chunk.length-1].n, questions: chunk });
  }
  return out;
}
const FORMS = BANK.map(f => ({ ...f, label: FORM_LABEL(f), ela: elaBlocks(f), math: mathBlocks(f) }));
const BLOCKS = {};
FORMS.forEach(f => f.ela.concat(f.math).forEach(b => { b.formLabel = f.label; BLOCKS[b.id] = b; }));
const NEW_TO_ISEE = { rea: 'Revising/Editing: single sentences and short paragraphs',
                      reb: 'Revising/Editing: a whole passage',
                      grid: 'Grid-in math: no choices, you produce the number' };
const MIX_N = { rea: 3, reb: 2, grid: 3 };        // forms per mixed set

/* ============================ STATE ============================ */
const app = document.getElementById('app');
let timerId = null, elapsed = 0;
let RUN = null;     // {blocks, title, target, test, oneAtATime, idx, answers:{qid:value}}

function save(k,v){ try{ localStorage.setItem('shsat:'+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v=localStorage.getItem('shsat:'+k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+String(r).padStart(2,"0"); }
function startTimer(target){
  elapsed=0; clearInterval(timerId);
  timerId=setInterval(()=>{ elapsed++; const el=document.getElementById('timer');
    if(el){ el.textContent=fmt(elapsed); el.className='timer'+(elapsed>target?' over':''); } },1000);
}
function stopTimer(){ clearInterval(timerId); timerId=null; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

/* grid-in answers: "-0.4", "19.2", "3/4", ".5" all compare numerically */
function num(s){
  s = String(s==null?'':s).trim().replace(/[,\s]/g,'').replace(/[–−]/g,'-');
  if(!s) return NaN;
  const m = s.match(/^(-?)(\d+)\/(\d+)$/);
  if(m) return (m[1]?-1:1) * (+m[2]) / (+m[3]);
  return Number(s);
}
function gridOK(given, key){ const a=num(given), b=num(key); return !isNaN(a) && !isNaN(b) && Math.abs(a-b) < 1e-6; }

function isRight(q, v){
  if(q.kind==='grid') return gridOK(v, q.a);
  return v !== undefined && v !== null && v !== '' && +v === q.a;
}
function shown(q, v){          // what the student chose, for the report
  if(v===undefined||v===null||v==='') return 'left blank';
  if(q.kind==='grid') return esc(v);
  return q.kind==='text' ? q.letters[v] + '. ' + (q.html ? q.opts[v] : esc(q.opts[v])) : q.letters[v];
}
function keyText(q){
  if(q.kind==='grid') return esc(q.a);
  return q.kind==='text' ? q.letters[q.a] + '. ' + (q.html ? q.opts[q.a] : esc(q.opts[q.a])) : q.letters[q.a];
}
function expHTML(q){
  if(!q.exp) return '<i>No explanation is published for this form.</i>';
  return q.kind==='text' ? q.exp : '<img src="'+q.exp+'" alt="explanation">';
}

/* ============================ HOME ============================ */
function home(){
  stopTimer(); RUN = null;
  const scores = load('scores',{});
  const nMiss = load('misslog',[]).length;
  const tests = load('tests', {});
  const one = load('one', false);
  const undone = k => FORMS.map(f => f.ela.concat(f.math).find(b => b.kind===k)).filter(b => !scores[b.id]).length;
  const today = new Date().toISOString().slice(0,10);
  const daily = load('daily', {});
  const doneToday = daily.last === today;
  const grammarToday = load('dailyGrammar', '') === today;
  let h = `<h2>Today</h2>
    <div class="card">
      <div class="meta" style="margin:0 0 10px">${daily.streak ? '<b>' + daily.streak + '-day streak.</b> ' : ''}Two separate sets. Each adapts to him and never repeats a question within a week.</div>
      ${(() => { const r = load('adrun', null); return r && r.i < ADAPT_N && Date.now() - r.ts < 36e5*24 ? `<div class="drill"><span><b>Unfinished math set</b> <span class="meta">${r.i + (r.checked ? 1 : 0)} of ${ADAPT_N} answered</span></span><button class="small primary" onclick="resumeAdaptive()">Resume</button></div>` : ''; })()}
      ${(() => { const t = load('testrun', null); return t && Date.now() - t.started < 4*3600e3 ? `<div class="drill"><span><b>Unfinished test: ${esc(t.label)}</b> <span class="meta">${fmtClock(Math.max(0, t.target - Math.floor((Date.now() - t.started)/1000)))} left on the clock</span></span><button class="small primary" onclick="resumeTest()">Resume</button></div>` : ''; })()}
      <div class="drill"><span><b>Math set</b> <span class="meta">${ADAPT_N} problems, one at a time, each one picked for you from the last answer &middot; ${doneToday ? 'done today: ' + daily.lastScore : 'not yet today'}</span></span>
        <button class="small ${doneToday ? '' : 'primary'}" onclick="startAdaptive()">${doneToday ? 'Another' : 'Start'}</button></div>
      <div class="drill"><span><b>Grammar set</b> <span class="meta">one Revising/Editing concept, then real questions, about 8 minutes &middot; ${grammarToday ? 'done today' : 'not yet today'}</span></span>
        <a href="grammar.html?daily=1"><button class="small ${grammarToday ? '' : 'primary'}">${grammarToday ? 'Another' : 'Start'}</button></a></div>
    </div>
    <h2>Start here: what the ISEE did not cover</h2>
    <div class="card">
      <p class="meta" style="margin:0 0 10px">The ISEE has no grammar section and no fill-in math. The SHSAT has both: 9 to 20 Revising/Editing questions at the start of ELA, and 5 grid-in questions at the start of Math. Each button below mixes pieces from a few forms you have not done yet. Reading and multiple-choice math overlap with the ISEE, so they are further down.</p>
      <div class="drill"><span>Grammar lessons: the 13 concepts behind Revising/Editing, taught by example <span class="meta">then the real questions</span></span><a href="grammar.html"><button class="small primary">Open</button></a></div>
      ${Object.keys(NEW_TO_ISEE).map(k => `<div class="drill"><span>${NEW_TO_ISEE[k]} <span class="meta">${undone(k)} of ${FORMS.length} forms left</span></span>
        <button class="small primary" onclick="startMix('${k}')">Start</button></div>`).join('')}
    </div>
    <h2>Full tests</h2>
    <div class="card">
      <p class="meta" style="margin:0 0 10px">Each official sample test under test conditions: a 3-hour clock, one question at a time, a passage set at a time with no going back once it is submitted, a break between sections, and the score only at the end. A section alone is 90 minutes.</p>
      <p class="meta" style="margin:0 0 8px">Highlighted tests have no score yet. "Seen" counts questions from that form he has already met in drills and lessons, so the lowest counts make the cleanest full tests. <a href="strategy.html">How to take the test &rarr;</a></p>
      <table class="tests"><tr><th>Test</th><th>Last result</th><th></th></tr>
      ${FORMS.map(f => { const r = tests[f.id] || {}; const cell = k => r[k] ? `<span class="meta">${k==='all'?'Full':k==='ela'?'ELA':'Math'}: </span>${r[k].ela?'ELA '+r[k].ela:''}${r[k].ela&&r[k].math?' &middot; ':''}${r[k].math?'Math '+r[k].math:''}${r[k].est ? ' <b>&asymp; ' + r[k].est + '</b>' : ''} <span class="meta">${r[k].date}</span>` : '';
        const last = ['all','ela','math'].map(cell).filter(Boolean).join('<br>');
        return `<tr class="${last ? '' : 'fresh'}"><td><b>${f.label}</b><div class="meta" id="seen_${f.id}"></div></td><td>${last || '<span class="tag">no score yet</span>'}</td>
          <td class="row" style="justify-content:flex-end"><button class="small primary" onclick="startTest('all','${f.id}')">Full test</button><button class="small" onclick="startTest('ela','${f.id}')">ELA</button><button class="small" onclick="startTest('math','${f.id}')">Math</button></td></tr>`; }).join('')}
      </table>
    </div>
    <div class="card">
      <h3>Review sheet</h3>
      <div class="meta">${nMiss? nMiss+' question'+(nMiss===1?'':'s')+' logged' : 'nothing logged yet'}</div>
      <button class="primary" style="margin-top:10px" onclick="go('report')">Open &amp; print</button>
    </div>
    <p class="note">The real test is 3 hours for both sections, no calculator. From fall 2026 it is a computer-adaptive test with 50 ELA and 50 Math items; the content is the same as these paper forms, and the grid-in questions are typed into an equation editor rather than bubbled.</p>
    <h2>Practice one piece at a time</h2>
    <p class="meta">Answers and explanations are shown as soon as you submit. Scores are remembered on this device.</p>
    <label class="meta" style="display:block;margin:0 0 8px"><input type="checkbox" id="onecb" ${one?'checked':''} onchange="save('one',this.checked)"> In drills, show one question at a time with no going back.</label>`;
  FORMS.forEach(f=>{
    const done = f.ela.concat(f.math).filter(b=>scores[b.id]).length;
    h += `<details class="card"><summary>${f.label} <span class="meta">${done? done+' of '+(f.ela.length+f.math.length)+' pieces done' : ''}</span></summary>`;
    h += `<div class="meta" style="margin:8px 0 2px"><span class="tag">ELA</span></div>`;
    f.ela.forEach(b=>h+=drillRow(b, scores[b.id]));
    h += `<div class="meta" style="margin:14px 0 2px"><span class="tag">Math</span></div>`;
    f.math.forEach(b=>h+=drillRow(b, scores[b.id]));
    h += `</details>`;
  });
  h += `<p class="note" style="margin-top:26px">Read the explanation on every one you miss, not just the score.</p>`;
  app.innerHTML = h; markSeen();
}
/* how many questions of each form he has already met, from the shared log when it is reachable */
let SEEN = null;
async function markSeen(){
  if (!SEEN) {
    SEEN = {};
    let rows = load('log', []);
    if (LOG_URL) { try { rows = await (await fetch(LOG_URL)).json(); } catch (e) {} }
    rows.forEach(e => { if (e.kind === 'answer' && e.form) SEEN[e.form] = (SEEN[e.form] || 0) + 1; });
  }
  FORMS.forEach(f => { const el = document.getElementById('seen_' + f.id); if (el) el.textContent = (SEEN[f.label] || 0) + ' of 114 seen'; });
}
function drillRow(b, s){
  const tag = b.kind in NEW_TO_ISEE ? '<span class="tag">not on ISEE</span>' : '';
  return `<div class="drill"><span>${tag}${esc(b.title)} <span class="meta">${b.questions.length} q</span></span>
    <span class="row"><span class="meta">${s? s.c+' / '+s.t+' in '+fmt(s.time) : ''}</span>
    <button class="small ${s?'':'primary'}" onclick="startDrill('${b.id}')">${s?'Again':'Start'}</button></span></div>`;
}

/* ============================ RUNNER ============================ */
window.startMix = function(kind){
  const scores = load('scores',{});
  const pool = FORMS.map(f => f.ela.concat(f.math).filter(b => b.kind===kind)).filter(a => a.length);
  const fresh = pool.filter(a => !a.some(b => scores[b.id])), done = pool.filter(a => a.some(b => scores[b.id]));
  const shuffle = a => a.sort(() => Math.random() - .5);
  const picks = shuffle(fresh).concat(shuffle(done)).slice(0, MIX_N[kind]).flat();
  const n = picks.reduce((s,b) => s + b.questions.length, 0);
  RUN = { blocks: picks, title: NEW_TO_ISEE[kind].split(':')[0], mix: true, target: Math.round(SECTION_MIN*60*n/57),
          test:false, one: load('one',false), idx:0, answers:{} };
  runView();
};
/* Daily: R/E (A and B alternate), grid-ins, then reading and math MC on alternate days. Undone blocks first. */
window.startDrill = function(id){
  const b = BLOCKS[id];
  const n = b.questions.length;
  RUN = { blocks:[b], title:b.title, target:Math.round(SECTION_MIN*60*n/57), test:false,
          one: load('one',false), idx:0, answers:{}, form:b.form };
  runView();
};
/* ---- Estimated SHSAT scaled score. The DOE does not publish its raw-to-scaled curve and
   re-norms it every year; these anchors are the widely quoted ones (44 right of 57 -> about 278
   per section, 51 -> about 308, 30 -> about 218) and agree with the published cutoffs. Treat the
   result as plus or minus 15 composite points. The 2026 test (50 + 50, adaptive) is scored
   differently again. ---- */
const SCALE = [[0,40],[6,80],[10,110],[16,164],[23,194],[30,218],[37,252],[44,278],[51,308],[57,350]];
function scaled(raw, total){
  const r = raw * 57 / total;
  for (let i = 1; i < SCALE.length; i++) if (r <= SCALE[i][0]) { const [a,b] = SCALE[i-1], [c,d] = SCALE[i]; return Math.round(b + (d-b) * (r-a) / (c-a)); }
  return SCALE[SCALE.length-1][1];
}
function estimate(ela, math){
  const part = v => { if (!v) return null; const [c,t] = v.split('/').map(Number); return scaled(c, t); };
  const e = part(ela), m = part(math);
  return { ela: e, math: m, composite: e != null && m != null ? e + m : null };
}
const CUTOFFS = [['Stuyvesant',561],['HSMSE at City College',539],['Queens HS for the Sciences',531],['Bronx Science',525],['Staten Island Tech',517],['HS of American Studies',507],['Brooklyn Tech',506],['Brooklyn Latin',495]];

/* ============================ TEST MODE ============================
   One form under test conditions: countdown clock, one question at a time, a set
   (passage or math group) at a time with a navigator, no return to a submitted set,
   a break between sections, no feedback until the score report. Grading and the
   review sheet reuse finish(). */
let TT = null;   // countdown interval
window.startTest = function(section, fid){
  const f = FORMS.find(x=>x.id===fid);
  RUN = { blocks: [], title: f.label + ' — ' + (section==='all' ? 'full test' : section==='ela' ? 'English Language Arts' : 'Mathematics'),
          target: SECTION_MIN*60*(section==='all'?2:1), test:true, section, form:fid, f, answers:{}, flags:{}, secs:{} };
  const mins = Math.round(RUN.target/60);
  app.innerHTML = `<div class="card"><h2 style="margin:0 0 6px">${esc(f.label)}</h2>
    <div class="meta" style="margin-bottom:12px">${section==='all' ? '57 English Language Arts questions and 57 Mathematics questions' : '57 questions'} &middot; ${mins} minutes</div>
    <p>This works like the real test:</p>
    <ul class="compact">
      <li>The clock starts when you begin and does not stop. When it reaches zero the test is submitted as it stands.</li>
      <li>You see one question at a time. Within a passage set you can move back and forth and flag questions to revisit.</li>
      <li>When you submit a set you cannot return to it.</li>
      <li>No calculator. Use scrap paper. Grid-in answers are typed as a number (a decimal or a fraction like 3/4).</li>
      <li>No answers or explanations until the end. Then you get your score and a review sheet of every miss.</li>
    </ul>
    <div class="row" style="margin-top:14px">
      ${section==='all' ? `<button class="primary" onclick="testBegin('ela')">Begin with English Language Arts</button><button class="primary" onclick="testBegin('math')">Begin with Mathematics</button>` : `<button class="primary" onclick="testBegin('${section}')">Begin</button>`}
      <button onclick="go('home')">Not now</button><a href="strategy.html" class="meta" style="margin-left:auto">How to take the test &rarr;</a></div></div>`;
  window.scrollTo(0,0);
};
window.testBegin = function(first){
  const f = RUN.f;
  RUN.blocks = RUN.section==='all' ? (first==='ela' ? f.ela.concat(f.math) : f.math.concat(f.ela)) : f[RUN.section];
  RUN.setIdx = 0; RUN.qIdx = 0; RUN.started = Date.now(); RUN.sid = newSessionId();
  save('misslog', []);
  document.body.classList.add('testing');
  try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{}); } catch(e){}
  clearInterval(TT); TT = setInterval(testTick, 1000);
  persistTest(); testView();
};
// any answer change during a test is saved at once, so a reload loses nothing
app.addEventListener('change', () => { if (document.body.classList.contains('testing')) persistTest(); });
app.addEventListener('input', () => { if (document.body.classList.contains('testing')) persistTest(); });
function fmtClock(sec){ return fmt(Math.max(0,sec)).replace(/^(\d+):/, (m,a)=> (a>=60? Math.floor(a/60)+':'+String(a%60).padStart(2,'0')+':' : a+':')); }
function persistTest(){
  if (!RUN || !RUN.test || !RUN.started) return;
  save('testrun', { form:RUN.form, label:RUN.f.label, section:RUN.section, first:RUN.blocks[0].section, title:RUN.title, target:RUN.target, started:RUN.started, sid:RUN.sid,
                    setIdx:RUN.setIdx, qIdx:RUN.qIdx, answers:RUN.answers, flags:RUN.flags, secs:RUN.secs, logged:RUN.logged||{} });
}
window.resumeTest = function(){
  const t = load('testrun', null); if (!t) return;
  const f = FORMS.find(x => x.id === t.form);
  RUN = { blocks: t.section==='all' ? (t.first==='ela' ? f.ela.concat(f.math) : f.math.concat(f.ela)) : f[t.section], title:t.title, target:t.target, test:true, section:t.section, form:t.form, f,
          answers:t.answers||{}, flags:t.flags||{}, secs:t.secs||{}, setIdx:t.setIdx, qIdx:t.qIdx, started:t.started, sid:t.sid, logged:t.logged||{} };
  document.body.classList.add('testing');
  clearInterval(TT); TT = setInterval(testTick, 1000);
  if (testLeft() <= 0) { testFinish(); return; }
  testView();
};
function testLeft(){ return RUN.target - Math.floor((Date.now() - RUN.started)/1000); }
function testTick(){
  const el = document.getElementById('clock'); const left = testLeft();
  if (el) { el.textContent = fmtClock(left); el.classList.toggle('low', left < 600); }
  if (left <= 0) { clearInterval(TT); testFinish(); }
}
function testView(){
  const b = RUN.blocks[RUN.setIdx], q = b.questions[RUN.qIdx], n = b.questions.length;
  const secName = b.section==='ela' ? 'English Language Arts' : 'Mathematics';
  const setsInSec = RUN.blocks.filter(x => x.section===b.section), setNo = setsInSec.indexOf(b)+1;
  let h = `<div class="tbar"><b>${esc(RUN.f.label)}</b><span>${secName}</span><span>Set ${setNo} of ${setsInSec.length}</span><span>Question ${RUN.qIdx+1} of ${n}</span><span class="clock" id="clock">—</span></div>`;
  const qh = `<div class="card tq" id="tq">` + qHTML(q, RUN.qIdx) + `</div>`;
  h += b.passage ? `<div class="split">${passageHTML(b.passage)}<div>${qh}</div></div>` : qh;
  h += `<div class="tnav">${b.questions.map((x,i) => `<button class="${RUN.answers[x.id]!==undefined && RUN.answers[x.id]!=='' ? 'done' : ''} ${i===RUN.qIdx?'cur':''} ${RUN.flags[x.id]?'flag':''}" onclick="testGo(${i})">${x.n}</button>`).join('')}</div>
    <div class="row"><button onclick="testGo(${RUN.qIdx-1})" ${RUN.qIdx===0?'disabled':''}>&larr; Previous</button>
      <button onclick="testFlag()">${RUN.flags[q.id] ? 'Unflag' : 'Flag for review'}</button>
      ${RUN.qIdx < n-1 ? `<button class="primary" onclick="testGo(${RUN.qIdx+1})">Next &rarr;</button>` : `<button class="primary" onclick="testSubmitSet()">Submit this set &rarr;</button>`}
      <span class="note" style="margin-left:auto">Submitting a set is final.</span></div><div id="tconfirm"></div>`;
  app.innerHTML = h;
  // the drill renderer hides explanations and marks nothing, which is what a test needs
  const box = document.getElementById('e_' + RUN.qIdx); if (box) box.remove();
  RUN.qStart = Date.now(); testTick();
  window.scrollTo(0,0);
}
function testLeave(){ const q = RUN.blocks[RUN.setIdx].questions[RUN.qIdx]; RUN.secs[q.id] = (RUN.secs[q.id]||0) + Math.round((Date.now()-RUN.qStart)/1000); }
window.testGo = function(i){ testLeave(); RUN.qIdx = i; persistTest(); testView(); };
window.testFlag = function(){ const q = RUN.blocks[RUN.setIdx].questions[RUN.qIdx]; RUN.flags[q.id] = !RUN.flags[q.id]; testView(); };
window.testSubmitSet = function(){
  const b = RUN.blocks[RUN.setIdx];
  const blank = b.questions.filter(x => RUN.answers[x.id]===undefined || RUN.answers[x.id]==='').length;
  const box = document.getElementById('tconfirm');
  if (box) { box.innerHTML = `<div class="card" style="border-color:var(--bad)"><b>${blank ? blank + ' question' + (blank>1?'s':'') + ' in this set ' + (blank>1?'are':'is') + ' still unanswered. ' : ''}Submit this set?</b> You cannot come back to it.
      <div class="row" style="margin-top:10px"><button class="primary" onclick="testSubmitSetNow()">Submit set</button><button onclick="document.getElementById('tconfirm').innerHTML=''">Keep working</button></div></div>`; box.scrollIntoView({behavior:'smooth', block:'nearest'}); return; }
  testSubmitSetNow();
};
window.testSubmitSetNow = function(){
  const b = RUN.blocks[RUN.setIdx];
  testLeave();
  // the set's answers go to the sheet now, so a crash or a closed tab later still leaves a record
  RUN.logged = RUN.logged || {};
  if (!RUN.logged[b.id]) { RUN.logged[b.id] = true; logEvents(b.questions.map(q => { const v = RUN.answers[q.id]; return { app:'practice', session:RUN.sid, kind:'answer', form:b.formLabel, block:b.title, n:q.n, tag:b.kind,
      chosen:plainText(shown(q,v)), correct:plainText(keyText(q)), ok:isRight(q,v)?1:0, secs:(RUN.secs||{})[q.id]||'' }; })); persistTest(); }
  const next = RUN.blocks[RUN.setIdx+1];
  if (!next) { testFinish(); return; }
  if (next.section !== b.section) {
    RUN.setIdx++; RUN.qIdx = 0; persistTest();
    const done = b.section==='ela' ? 'English Language Arts' : 'Mathematics', up = next.section==='ela' ? 'English Language Arts' : 'Mathematics';
    app.innerHTML = `<div class="tbar"><b>${esc(RUN.f.label)}</b><span class="clock" id="clock">—</span></div>
      <div class="card" style="margin-top:14px"><h2 style="margin:0 0 6px">${done} complete</h2><p>The clock keeps running. Take a breath, then continue to ${up}.</p>
      <button class="primary" onclick="testView()">Continue to ${up} &rarr;</button></div>`;
    testTick(); window.scrollTo(0,0); return;
  }
  RUN.setIdx++; RUN.qIdx = 0; persistTest(); testView();
};
function testFinish(){
  clearInterval(TT); TT = null;
  localStorage.removeItem('shsat:testrun');
  document.body.classList.remove('testing');
  try { document.exitFullscreen && document.fullscreenElement && document.exitFullscreen().catch(()=>{}); } catch(e){}
  elapsed = Math.min(RUN.target, Math.round((Date.now() - RUN.started)/1000));
  finish();
}

function qHTML(q, i){
  const stem = q.kind==='text' ? (q.html.startsWith('<p>') ? q.html.replace('<p>', `<p>${q.n}. `) : `<p>${q.n}.</p>` + q.html) : '';
  let h = `<div class="q" id="q_${i}"><div class="qtext">${stem}</div>`;
  if(q.kind!=='text') h += `<img class="qimg" src="${q.img}" alt="question ${q.n}">`;
  if(q.kind==='grid'){
    h += `<div class="gridin" id="g_${i}"><input type="text" inputmode="decimal" placeholder="your answer" data-q="${i}" value="${esc(RUN.answers[q.id]||'')}" oninput="RUN.answers['${q.id}']=this.value"></div>`;
  } else {
    h += `<div class="${q.kind==='img'?'letters':''}">`;
    q.letters.forEach((L,j)=>{
      const on = RUN.answers[q.id]===j ? 'checked' : '';
      h += `<label class="opt" id="o_${i}_${j}"><input type="radio" name="q${i}" value="${j}" ${on} onchange="RUN.answers['${q.id}']=${j}"><b>${L}.</b>${q.kind==='text'? esc(q.opts[j]) : ''}</label>`;
    });
    h += `</div>`;
  }
  h += `<div class="exp hide" id="e_${i}"></div></div>`;
  return h;
}
function passageHTML(p){
  if(!p) return '';
  return `<div class="passage">${p.title?'<h3>'+esc(p.title)+'</h3>':''}${p.html}${(p.figs||[]).map(f=>`<img src="${f}" alt="figure">`).join('')}</div>`;
}

/* flat list of questions with their block, so one-at-a-time mode can step through */
function flat(){ const out=[]; RUN.blocks.forEach(b=>b.questions.forEach(q=>out.push({b,q}))); return out; }

function runView(){
  RUN.sid = newSessionId(); RUN.secs = {};
  const all = flat();
  let h = `<div class="bar"><button onclick="confirmHome()">&larr; Back</button>
     <span>${esc(RUN.title)}</span><span>Target ${fmt(RUN.target)}</span><span class="timer" id="timer">0:00</span>
     ${RUN.one? `<span id="prog" class="meta">1 / ${all.length}</span>`:''}</div>`;
  if(RUN.one){
    h += `<div id="one"></div>`;
    app.innerHTML = h; startTimer(RUN.target); RUN.idx = 0; renderOne();
    return;
  }
  let i = 0;
  RUN.blocks.forEach(b=>{
    h += `<h2>${esc((RUN.mix ? b.formLabel + ' — ' : '') + b.title)}</h2>` + passageHTML(b.passage) + `<div class="card">`;
    b.questions.forEach(q=>{ h += qHTML(q, i++); });
    h += `</div>`;
  });
  h += `<button class="primary" style="margin-top:14px" onclick="finish()">Submit answers</button>`;
  app.innerHTML = h;
  startTimer(RUN.target);
}
function renderOne(){
  const all = flat(); const {b,q} = all[RUN.idx];
  const prev = RUN.idx>0 ? all[RUN.idx-1].b : null;
  let h = '';
  if(b.passage && b !== prev) h += passageHTML(b.passage);
  else if(b.passage) h += `<details class="passage" style="padding:10px 18px"><summary class="meta">Show the passage again</summary>${b.passage.html}${(b.passage.figs||[]).map(f=>`<img src="${f}">`).join('')}</details>`;
  h += `<div class="card">` + qHTML(q, RUN.idx) + `</div>
    <div class="row"><button class="primary" onclick="nextOne()">${RUN.idx===all.length-1?'Submit answers':'Next →'}</button>
    <span class="note">You cannot come back to this question.</span></div>`;
  document.getElementById('one').innerHTML = h;
  RUN.qStart = Date.now();
  document.getElementById('prog').textContent = (RUN.idx+1) + ' / ' + all.length;
  window.scrollTo(0,0);
}
window.nextOne = function(){
  const all = flat(); const {q} = all[RUN.idx];
  const v = RUN.answers[q.id];
  if(v===undefined || v===''){ if(!confirm('No answer chosen. Leave it blank and move on?')) return; }
  RUN.secs[q.id] = Math.round((Date.now() - RUN.qStart)/1000);
  if(RUN.idx === all.length-1){ finish(); return; }
  RUN.idx++; renderOne();
};
window.confirmHome = function(){
  if(RUN && Object.keys(RUN.answers).length && !confirm('Leave this set? Answers so far will be lost.')) return;
  go('home');
};

window.finish = function(){
  stopTimer();
  const all = flat();
  const time = elapsed;
  let c = 0;
  const missed = [];
  const perBlock = {};
  all.forEach(({b,q})=>{
    const v = RUN.answers[q.id];
    const ok = isRight(q, v);
    if(ok) c++;
    const pb = perBlock[b.id] = perBlock[b.id] || {c:0,t:0};
    pb.t++; if(ok) pb.c++;
    if(!ok) missed.push({
      setTitle: RUN.mix ? esc(b.formLabel + ' — ' + b.title) : RUN.blocks.length>1 ? esc(RUN.title) + ' — ' + esc(b.title) : esc(b.title),
      form: b.form,
      qhtml: q.kind==='text' ? q.n+'. '+q.html : `<img src="${q.img}" alt="question ${q.n}">`,
      qplain: q.kind==='text' ? q.n+'. '+plainText(q.html).slice(0,90) : 'Question '+q.n,
      chosen: shown(q, v), correct: keyText(q), exp: expHTML(q)
    });
  });
  // per-block scores (drills) and a section score
  const scores = load('scores',{});
  RUN.blocks.forEach(b=>{ const pb=perBlock[b.id]; scores[b.id]={c:pb.c,t:pb.t,time:RUN.blocks.length>1? Math.round(time*pb.t/all.length) : time}; });
  save('scores', scores);
  const log = load('misslog', []);
  missed.forEach(m=>log.push({...m, setScore:c+' / '+all.length, setTime:time}));
  save('misslog', log.slice(-300));

  if(RUN.test){
    const tot = sec => { const bs = RUN.blocks.filter(b => b.section === sec); return bs.length ? bs.reduce((s,b) => s + perBlock[b.id].c, 0) + '/' + bs.reduce((s,b) => s + perBlock[b.id].t, 0) : ''; };
    RUN.rec = { ela: tot('ela'), math: tot('math'), date: new Date().toLocaleDateString(), time };
    const est = estimate(RUN.rec.ela, RUN.rec.math);
    RUN.rec.est = est.composite != null ? est.composite : (est.ela != null ? est.ela : est.math);
    RUN.logTitle = RUN.title + (RUN.rec.ela ? ' \u00b7 ELA ' + RUN.rec.ela : '') + (RUN.rec.math ? ' \u00b7 Math ' + RUN.rec.math : '') + ' \u00b7 est. ' + RUN.rec.est;
  }
  logEvents(all.filter(({b}) => !(RUN.logged && RUN.logged[b.id])).map(({b,q}) => { const v = RUN.answers[q.id]; return { app:'practice', session:RUN.sid, kind:'answer', form:b.formLabel, block:b.title, n:q.n, tag:b.kind,
      chosen:plainText(shown(q,v)), correct:plainText(keyText(q)), ok:isRight(q,v)?1:0, secs:(RUN.secs||{})[q.id]||'' }; })
    .concat([{ app:'practice', session:RUN.sid, kind:'session', title:RUN.logTitle || RUN.title, score:c+'/'+all.length, secs:time, tag:RUN.daily?'daily':RUN.test?'section':RUN.mix?'mix':'drill' }]));
  if(RUN.test){
    const tests = load('tests', {}); (tests[RUN.form] = tests[RUN.form] || {})[RUN.section] = RUN.rec; save('tests', tests);
    save('lasttest', { ...RUN.rec, title: RUN.title, form: RUN.form, ts: Date.now() });
    go('report'); return;
  }

  // drill: mark answers inline, show explanations
  if(RUN.one){
    // rebuild the whole set as a scrolling page so every question can be reviewed
    let h = `<div class="bar"><button onclick="go('home')">&larr; Back</button><span>${esc(RUN.title)}</span></div>`;
    let i = 0;
    RUN.blocks.forEach(b=>{ h += `<h2>${esc((RUN.mix ? b.formLabel + ' — ' : '') + b.title)}</h2>` + passageHTML(b.passage) + `<div class="card">`; b.questions.forEach(q=>{ h += qHTML(q, i++); }); h += `</div>`; });
    app.innerHTML = h;
  }
  all.forEach(({q}, i)=>{
    const v = RUN.answers[q.id];
    if(q.kind==='grid'){
      const g = document.getElementById('g_'+i);
      g.classList.add(isRight(q,v)?'correct':'chosen-wrong');
      g.querySelector('input').disabled = true;
      g.insertAdjacentHTML('beforeend', `<span class="meta" style="margin-left:10px">Answer: <b>${esc(q.a)}</b></span>`);
    } else {
      document.getElementById(`o_${i}_${q.a}`).classList.add('correct');
      if(v!==undefined && v!=='' && +v!==q.a) document.getElementById(`o_${i}_${v}`).classList.add('chosen-wrong');
      document.querySelectorAll(`input[name="q${i}"]`).forEach(r=>r.disabled=true);
    }
    const e = document.getElementById('e_'+i); e.innerHTML = expHTML(q); e.classList.remove('hide');
  });
  const banner = document.createElement('div'); banner.className='card';
  banner.innerHTML = `<div class="score">${c} / ${all.length}</div>
    <div class="meta">Time ${fmt(time)} (target ${fmt(RUN.target)})</div>
    <div class="exp" style="margin-top:12px">${missed.length? 'Read the explanation on each one you missed, then say out loud what you would do differently.' : 'Clean sweep. Try a harder piece, or a full timed section.'}</div>
    <button class="primary" style="margin-top:12px" onclick="go('home')">Back to list</button>`;
  const first = app.querySelector('.card'); first.parentNode.insertBefore(banner, first);
  banner.scrollIntoView({behavior:'smooth'});
  document.querySelector('button.primary[onclick="finish()"]')?.remove();
};

/* ============================ REPORT ============================ */
function plainText(html){ const d=document.createElement('div'); d.innerHTML=String(html==null?'':html); return (d.textContent||'').replace(/\s+/g,' ').trim(); }

function reportView(){
  stopTimer();
  const log = load('misslog', []);
  const bySet = {};
  log.forEach(e=>{ (bySet[e.setTitle] = bySet[e.setTitle] || []).push(e); });
  let h = `<div class="bar noprint">
      <button onclick="go('home')">&larr; Back</button>
      <button class="primary" onclick="window.print()">Print / Save as PDF</button>
      <button onclick="emailReport()">Email results</button>
      <button onclick="clearReport()">Clear</button>
    </div>
    <div class="rpt-head"><h2 style="margin:0">Review sheet</h2>
    <div class="meta">Generated ${new Date().toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long', year:'numeric'})}</div></div>`;
  const lt = load('lasttest', null);
  if(lt && Date.now() - lt.ts < 6*3600e3){
    const pc = v => v ? Math.round(100 * v.split('/')[0] / v.split('/')[1]) + '%' : '';
    h += `<div class="card"><h3 style="margin:0 0 6px">${esc(lt.title)}</h3><div class="scorebar">
      ${lt.ela ? `<div>ELA<b>${lt.ela}</b><span class="meta">${pc(lt.ela)}</span></div>` : ''}
      ${lt.math ? `<div>Math<b>${lt.math}</b><span class="meta">${pc(lt.math)}</span></div>` : ''}
      ${lt.ela && lt.math ? `<div>Total<b>${+lt.ela.split('/')[0] + +lt.math.split('/')[0]} / 114</b></div>` : ''}
      <div>Time<b>${fmt(lt.time)}</b></div></div>
      ${(() => { const e = estimate(lt.ela, lt.math); if (e.ela == null && e.math == null) return '';
        const comp = e.composite;
        return `<div class="scorebar" style="margin-top:4px">${e.ela != null ? `<div>Est. ELA scaled<b>${e.ela}</b></div>` : ''}${e.math != null ? `<div>Est. Math scaled<b>${e.math}</b></div>` : ''}${comp != null ? `<div>Est. composite<b>${comp}</b><span class="meta">of 800</span></div>` : ''}</div>
        ${comp != null ? `<div class="meta" style="margin:6px 0 4px">2026 cutoffs (lowest composite admitted):</div><div class="row" style="gap:6px 14px;font:13px system-ui,sans-serif">${CUTOFFS.map(([n,c]) => `<span style="color:${comp >= c ? 'var(--good)' : '#9A9284'}">${comp >= c ? '\u2713' : '\u2013'} ${n} ${c}</span>`).join('')}</div>` : ''}`; })()}
      <p class="note" style="margin:8px 0 0">The scaled score is an estimate: the DOE does not publish its conversion and renorms it each year, so read it as plus or minus about 15 composite points. The 2026 test is 50 + 50 and computer-adaptive and is scored differently again, so the cutoffs are a guide to the target, not a prediction.</p></div>`;
  }
  if(!log.length){
    h += `<div class="card"><p>Nothing logged yet. Work through a piece, or run a full section, and every question you miss lands here.</p></div>`;
    app.innerHTML = h; return;
  }
  h += `<div class="scorebar">`;
  Object.keys(bySet).forEach(k=>{
    const rows = bySet[k], last = rows[rows.length-1];
    h += `<div>${k}<b>${rows.length} missed</b><span class="meta">${last.setScore} correct &middot; ${fmt(last.setTime)}</span></div>`;
  });
  h += `</div>`;
  h += `<p class="note noprint">On iPhone: <b>Print / Save as PDF</b>, then the share icon, then Mail. <b>Email results</b> sends the scores and the list of misses as plain text. <button class="linkish" onclick="changeMail()">Change email address</button></p>
        <p class="note">One card per question missed. Read the explanation, then say out loud what you would do differently. That sentence is the part that sticks.</p>`;
  Object.keys(bySet).forEach(setTitle=>{
    h += `<div class="rpt-sec">${setTitle}</div>`;
    bySet[setTitle].forEach(e=>{
      h += `<div class="rpt-item">
        <div class="rpt-q">${e.qhtml}</div>
        <div class="rpt-row"><span class="lab">You chose</span><span class="rpt-wrong">${e.chosen}</span></div>
        <div class="rpt-row"><span class="lab">Answer</span><span class="rpt-right">${e.correct}</span></div>
        <div class="exp">${e.exp}</div>
        <div class="rpt-row" style="margin-top:9px"><span class="lab">What I'd do differently</span>
          <span style="display:inline-block;border-bottom:1px solid var(--line);min-width:58%">&nbsp;</span></div>
      </div>`;
    });
  });
  app.innerHTML = h;
}
function recipient(force){
  let to = load('mailto', '');
  if(force || !to){ to = (prompt('Email results to which address?', to || '') || '').trim(); if(!to) return ''; save('mailto', to); }
  return to;
}
window.changeMail = function(){ if(recipient(true)) emailReport(); };
window.emailReport = function(){
  const log = load('misslog', []);
  if(!log.length){ alert('Nothing logged yet — work through a piece first.'); return; }
  const to = recipient(false); if(!to) return;
  const bySet = {}; log.forEach(e => { (bySet[e.setTitle] = bySet[e.setTitle] || []).push(e); });
  const when = new Date().toLocaleDateString(undefined, {day:'numeric', month:'long', year:'numeric'});
  const L = ['SHSAT practice — ' + when, ''];
  Object.keys(bySet).forEach(k => { const rows=bySet[k], last=rows[rows.length-1]; L.push(plainText(k) + ' — ' + last.setScore + ' correct, ' + fmt(last.setTime) + ', ' + rows.length + ' missed'); });
  Object.keys(bySet).forEach(k => { L.push('', plainText(k) + ':'); bySet[k].forEach(e => L.push('', '  ' + e.qplain, '      chose:   ' + plainText(e.chosen), '      correct: ' + plainText(e.correct))); });
  L.push('', 'Explanations are in the PDF.');
  let body = L.join('\n'); if(body.length > 4000) body = body.slice(0,4000) + '\n\n[…truncated — see the PDF]';
  location.href = 'mailto:' + encodeURIComponent(to) + '?subject=' + encodeURIComponent('SHSAT practice — ' + when + ' — ' + log.length + ' missed') + '&body=' + encodeURIComponent(body);
};
window.clearReport = function(){ if(confirm('Clear the review sheet?')){ save('misslog', []); go('report'); } };

/* ============================ ADAPTIVE MATH ============================
   Every math problem has a difficulty d in [0,1] (its percentile in the rated bank, mathmeta.js)
   and a topic. Vaughn has a level theta on the same scale. After a right answer the next
   problem comes from the band just above theta, after a wrong one from just below; theta
   moves by an Elo step each answer. Problems are not repeated within a week. */
const ADAPT_N = 12, BAND = 0.15, SLOPE = 8;
const MATHQ = FORMS.flatMap(f => f.math.flatMap(b => b.questions.map(q => {
  const m = (typeof MATHMETA !== 'undefined' && MATHMETA[q.id]) || {};
  return { ...q, formLabel: f.label, d: m.d == null ? 0.5 : m.d, topic: m.t || 'math' };
}))).concat((typeof GENMATH === 'undefined' ? [] : GENMATH).map(g => {
  const m = (typeof MATHMETA !== 'undefined' && MATHMETA[g.id]) || {};
  return { ...g, n: g.id.replace('gen:', ''), formLabel: 'Extra', letters: g.kind === 'grid' ? [] : ['A','B','C','D'],
           d: m.d == null ? 0.9 : m.d, topic: g.topic, kind: g.kind === 'grid' ? 'grid' : 'text' };
}));
let AD = null;   // {theta0, theta, i, right, sid, t0, qStart, cur, done:[], answered:{}}

function expected(theta, d){ return 1 / (1 + Math.exp(-(theta - d) * SLOPE)); }
function nextProblem(afterOk){
  const stat = load('mstat', {}), week = Date.now() - 7*864e5;
  const fresh = MATHQ.filter(q => !AD.answered[q.id] && !(stat[q.id] && stat[q.id].last > week));
  const pool = fresh.length ? fresh : MATHQ.filter(q => !AD.answered[q.id]);
  const th = AD.theta;
  let lo = afterOk == null ? th - BAND/2 : afterOk ? th : th - BAND;
  let hi = afterOk == null ? th + BAND/2 : afterOk ? th + BAND : th;
  let cand = [];
  for (let w = 0; w < 6 && !cand.length; w++) { cand = pool.filter(q => q.d >= lo - w*BAND && q.d <= hi + w*BAND); }
  const last = AD.cur, other = cand.filter(q => !last || q.topic !== last.topic);
  const from = other.length ? other : cand;
  return from[Math.floor(Math.random() * from.length)];
}
function persistAD(extra){
  save('adrun', { theta0:AD.theta0, theta:AD.theta, i:AD.i, right:AD.right, sid:AD.sid, t0:AD.t0, curId:AD.cur && AD.cur.id, answered:AD.answered, ts:Date.now(), ...(extra||{}) });
}
window.resumeAdaptive = function(){
  const r = load('adrun', null); if (!r) { startAdaptive(); return; }
  AD = { theta0:r.theta0, theta:r.theta, i:r.i, right:r.right, sid:r.sid, t0:r.t0, cur:MATHQ.find(q => q.id === r.curId) || null, answered:r.answered || {} };
  if (r.checked) { AD.i++; if (AD.i >= ADAPT_N) { adaptDone(); return; } AD.cur = nextProblem(r.lastOk); }
  if (!AD.cur) AD.cur = nextProblem(null);
  persistAD(); adaptView();
};
window.startAdaptive = async function(){
  let theta = load('theta', null);
  if (theta == null && LOG_URL) {              // a new device: pick the level up from the shared log
    try { const rows = await (await fetch(LOG_URL)).json();
      const m = rows.filter(r => r.kind === 'session' && /level \d+ \u2192 (\d+)/.test(r.title)).pop();
      if (m) theta = +RegExp.$1 / 100; } catch (e) {}
  }
  if (theta == null) theta = 0.65;             // Neal set the starting level; the first answers still move it fast
  AD = { theta0: theta, theta, i: 0, right: 0, sid: newSessionId(), t0: Date.now(), cur: null, answered: {} };
  AD.cur = nextProblem(null);
  persistAD(); adaptView();
};
function adaptView(){
  const q = AD.cur;
  let h = `<div class="bar"><button onclick="confirmHomeAD()">&larr; Back</button><span>Math set</span>
     <span id="prog" class="meta">${AD.i+1} / ${ADAPT_N}</span></div>
     <div class="card"><div class="meta" style="margin-bottom:6px">${esc(q.formLabel)}${q.img ? ', question ' + q.n : ''} &middot; ${esc(q.topic.replace(/-/g,' '))}</div>
     ${q.img ? `<img class="qimg" src="${q.img}" alt="question ${q.n}">` : `<div class="qmath">${q.html}</div>`}`;
  if (q.kind === 'grid') h += `<div class="gridin" id="ad_g"><input type="text" inputmode="decimal" placeholder="your answer" id="ad_in"></div>`;
  else { h += `<div class="${q.opts ? '' : 'letters'}">`; q.letters.forEach((L,j) => { h += `<label class="opt" id="ad_o${j}"><input type="radio" name="adq" value="${j}"><b>${L}.</b>${q.opts ? q.opts[j] : ''}</label>`; }); h += `</div>`; }
  h += `<div id="ad_exp" class="exp hide"></div><div class="row" style="margin-top:12px"><button class="primary" id="ad_btn" onclick="adaptCheck()">Check</button></div></div>`;
  app.innerHTML = h; AD.qStart = Date.now(); window.scrollTo(0,0);
  const inp = document.getElementById('ad_in'); if (inp) { inp.focus(); inp.addEventListener('keydown', e => { if (e.key === 'Enter') adaptCheck(); }); }
}
window.adaptCheck = function(){
  const q = AD.cur;
  let v;
  if (q.kind === 'grid') v = document.getElementById('ad_in').value.trim();
  else { const sel = document.querySelector('input[name="adq"]:checked'); v = sel ? +sel.value : ''; }
  if (v === '' ) { alert('Pick an answer first.'); return; }
  const ok = isRight(q, v), secs = Math.round((Date.now() - AD.qStart)/1000);
  const K = AD.i < 6 ? 0.10 : 0.05;
  AD.theta = Math.min(0.98, Math.max(0.02, AD.theta + K * ((ok ? 1 : 0) - expected(AD.theta, q.d))));
  AD.answered[q.id] = true; if (ok) AD.right++;
  const stat = load('mstat', {}); const st = stat[q.id] = stat[q.id] || { right: 0, wrong: 0 }; st.last = Date.now(); if (ok) st.right++; else st.wrong++; save('mstat', stat);
  save('theta', AD.theta);
  logEvents([{ app:'practice', session:AD.sid, kind:'answer', form:q.formLabel, block:q.topic, n:q.n, tag:'adaptive', chosen:plainText(shown(q, v)), correct:plainText(keyText(q)), ok:ok?1:0, secs }]);
  // mark and explain
  if (q.kind === 'grid') { const g = document.getElementById('ad_g'); g.classList.add(ok ? 'correct' : 'chosen-wrong'); g.querySelector('input').disabled = true; g.insertAdjacentHTML('beforeend', `<span class="meta" style="margin-left:10px">Answer: <b>${esc(q.a)}</b></span>`); }
  else { document.getElementById('ad_o' + q.a).classList.add('correct'); if (+v !== q.a) document.getElementById('ad_o' + v).classList.add('chosen-wrong'); document.querySelectorAll('input[name="adq"]').forEach(r => r.disabled = true); }
  const e = document.getElementById('ad_exp'); e.innerHTML = `<div class="meta" style="margin-bottom:6px">${ok ? '<b style="color:var(--good)">Right.</b>' : '<b style="color:var(--bad)">Not this one.</b>'}</div>` + expHTML(q); e.classList.remove('hide');
  persistAD({ checked:true, lastOk:ok });
  const btn = document.getElementById('ad_btn'); btn.textContent = AD.i + 1 >= ADAPT_N ? 'Finish' : 'Next \u2192'; btn.onclick = () => adaptNext(ok);
  e.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
};
window.adaptNext = function(ok){
  AD.i++;
  if (AD.i >= ADAPT_N) { adaptDone(); return; }
  AD.cur = nextProblem(ok); persistAD(); adaptView();
};
function adaptDone(){
  localStorage.removeItem('shsat:adrun');
  const a = Math.round(AD.theta0*100), b = Math.round(AD.theta*100), time = Math.round((Date.now() - AD.t0)/1000);
  logEvents([{ app:'practice', session:AD.sid, kind:'session', title:'Math set \u00b7 level ' + a + ' \u2192 ' + b, score:AD.right + '/' + ADAPT_N, secs:time, tag:'math-daily' }]);
  const d = load('daily',{}), today = new Date().toISOString().slice(0,10), yday = new Date(Date.now()-864e5).toISOString().slice(0,10);
  if (d.last !== today) { d.streak = (d.last === yday ? (d.streak||0) : 0) + 1; d.count = (d.count||0) + 1; }
  d.last = today; d.lastScore = AD.right + ' / ' + ADAPT_N; save('daily', d);
  app.innerHTML = `<div class="card" style="text-align:center"><div class="score">${AD.right} / ${ADAPT_N}</div>
    <div class="meta">Level ${a} &rarr; <b>${b}</b> of 100 &middot; ${fmt(time)}</div>
    <div class="exp" style="margin-top:12px;text-align:left">The level is where you sit in the bank of ${MATHQ.length} real SHSAT problems: ${b} means you are working at problems harder than ${b}% of them. It carries over to tomorrow.</div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="primary" onclick="startAdaptive()">Another set</button><button onclick="go('home')">Home</button></div></div>`;
  window.scrollTo(0,0);
}
window.confirmHomeAD = function(){ if (AD && AD.i && !confirm('Leave this set? You can resume it from the home page.')) return; go('home'); };

window.go = function(name){
  window.scrollTo(0,0);
  if(name==='home') home();
  else if(name==='report') reportView();
};
home();
</script>
